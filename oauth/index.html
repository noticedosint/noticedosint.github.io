<!doctype html>
<meta charset="utf-8">
<title>Код авторизації</title>
<meta name="robots" content="noindex">
<style>
 body{background:#0f1115;color:#e7e9ee;font:16px/1.6 system-ui,sans-serif;
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
 main{max-width:640px;width:100%}
 code{display:block;background:#1a1d24;border:1px solid #2b303b;border-radius:10px;
      padding:14px 16px;margin:14px 0;word-break:break-all;font-size:14px;color:#9fe6c0}
 p{color:#9aa2b1} b{color:#e7e9ee}
</style>
<main>
 <h1>Код отримано</h1>
 <p>Скопіюйте рядок нижче й передайте його в сесію — це одноразовий код,
    який за хвилину обміняється на токен.</p>
 <code id="out">…</code>
 <p id="hint"></p>
</main>
<script>
 const q = new URLSearchParams(location.search);
 const code = q.get('code'), err = q.get('error_description') || q.get('error');
 document.getElementById('out').textContent = code || err || 'ні коду, ні помилки в адресі';
 if (code) document.getElementById('hint').innerHTML =
   'Код дійсний <b>1 годину</b> і спрацьовує лише один раз.';
</script>
